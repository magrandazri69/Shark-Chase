<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Shark Chase 🦈</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #04263b;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; cursor: none; }
  #hud {
    position: fixed; top: 12px; left: 0; right: 0;
    display: flex; justify-content: space-between;
    padding: 0 18px;
    color: #eaf6ff; font-size: 20px; font-weight: bold;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
    pointer-events: none;
  }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; color: #eaf6ff;
    background: rgba(4, 30, 48, 0.72);
    backdrop-filter: blur(3px);
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    padding: 24px;
  }
  #overlay h1 { font-size: 44px; margin-bottom: 10px; letter-spacing: 1px; }
  #overlay p { font-size: 17px; margin: 6px 0; max-width: 340px; line-height: 1.55; }
  #overlay button {
    margin-top: 24px; padding: 15px 40px;
    font-family: inherit; font-size: 22px; font-weight: bold;
    color: #042b40; background: linear-gradient(#8fe3ff, #36b6f0);
    border: none; border-radius: 40px;
    cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  #overlay button:active { transform: translateY(2px); }
  #overlay button:disabled { opacity: 0.5; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <span id="score">🐟 0</span>
    <span id="best">🏆 0</span>
  </div>
  <div id="overlay">
    <h1>SHARK CHASE 🦈</h1>
    <p id="msg">Gerakkan jari (atau tetikus) — jerung sebenar akan mengejar!
       Telan ikan untuk markah. Elak ubur-ubur beracun 🪼</p>
    <button id="startBtn">MEMUATKAN…</button>
  </div>

<script>
  // Papar error pada skrin supaya senang debug di telefon/iPad.
  window.addEventListener("error", (ev) => {
    const o = document.getElementById("overlay"), m = document.getElementById("msg");
    if (o && m) { o.classList.remove("hidden");
      m.innerHTML = "⚠️ Error:<br><small>" + String(ev.message || ev.error) + "</small>"; }
  });
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl  = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const msgEl   = document.getElementById("msg");
  const startBtn = document.getElementById("startBtn");

  // ----- Realistic image assets (loaded by the player's browser) -----
  const BASE = "https://d8j0ntlcm91z4.cloudfront.net/user_35MBLo6h6uUCFDRFkC4V23IoiWp/";
  const URLS = {
    shark: BASE + "hf_20260617_182004_3bdd1cd8-245e-489c-b321-4240104cc5f4.png",
    fish:  BASE + "hf_20260617_182008_849baff6-3b8f-4b0a-8181-07daf08e6170.png",
    jelly: BASE + "hf_20260617_182025_de49bff3-0263-465b-b77b-bf8a877d9eb7.png",
    water: BASE + "hf_20260617_181807_d066891e-f37c-4d9f-81c1-83edb1b9ce56.png",
  };
  const IMG = {};
  let loaded = 0, total = Object.keys(URLS).length, ready = false;
  for (const k in URLS) {
    const im = new Image();
    im.onload  = () => { if (++loaded >= total) onReady(); };
    im.onerror = () => { if (++loaded >= total) onReady(); }; // teruskan walau ada yang gagal
    im.src = URLS[k];
    IMG[k] = im;
  }
  function onReady() {
    ready = true;
    startBtn.textContent = "MAIN";
    startBtn.disabled = false;
  }
  // jaga-jaga: kalau imej lambat, benarkan main selepas 6 saat
  setTimeout(() => { if (!ready) onReady(); }, 6000);

  // ----- Canvas sizing -----
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }
  window.addEventListener("resize", resize);
  resize();

  // ----- Input: shark follows finger / mouse -----
  const target = { x: W / 2, y: H / 2 };
  let pointerActive = false;
  function setTarget(e) {
    const t = e.touches ? e.touches[0] : e;
    if (!t) return;
    target.x = t.clientX; target.y = t.clientY; pointerActive = true;
  }
  canvas.addEventListener("mousemove", setTarget);
  canvas.addEventListener("touchstart", (e) => { setTarget(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("touchmove",  (e) => { setTarget(e); e.preventDefault(); }, { passive: false });

  // ----- State -----
  let best = 0;
  try { best = parseInt(localStorage.getItem("sharkBest") || "0", 10) || 0; } catch (_) {}
  bestEl.textContent = "🏆 " + best;

  let running = false, score = 0, t = 0, hintT = 0;
  const shark = { x: W / 2, y: H / 2, heading: 0 };
  let fishes = [], jellies = [], bubbles = [], particles = [];

  const rand = (a, b) => a + Math.random() * (b - a);
  function angLerp(a, b, f) { // shortest-path angle interpolation
    let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
    if (d < -Math.PI) d += Math.PI * 2;
    return a + d * f;
  }

  function spawnFish() {
    const edge = Math.floor(rand(0, 4));
    let x, y;
    if (edge === 0) { x = -30; y = rand(0, H); }
    else if (edge === 1) { x = W + 30; y = rand(0, H); }
    else if (edge === 2) { x = rand(0, W); y = -30; }
    else { x = rand(0, W); y = H + 30; }
    const ang = Math.atan2(H / 2 - y, W / 2 - x) + rand(-0.6, 0.6);
    const sp = rand(0.6, 1.5);
    fishes.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      size: rand(0.7, 1.15), wob: rand(0, 6.28), turn: rand(-0.004, 0.004) });
  }
  function spawnJelly() {
    jellies.push({ x: rand(40, W - 40), y: H + 40, vy: -rand(0.4, 1.0),
      vx: rand(-0.3, 0.3), pulse: rand(0, 6.28), size: rand(0.75, 1.15) });
  }

  function reset() {
    score = 0; t = 0;
    shark.x = W / 2; shark.y = H / 2; shark.heading = -Math.PI / 2;
    fishes = []; jellies = []; particles = [];
    bubbles = Array.from({ length: 36 }, () => ({
      x: rand(0, W), y: rand(0, H), r: rand(1, 3.5), v: rand(0.3, 1.2) }));
    for (let i = 0; i < 5; i++) spawnFish();
    scoreEl.textContent = "🐟 0";
  }

  function start() {
    if (!ready) return;
    reset(); running = true; hintT = 200;
    overlay.classList.add("hidden");
    if (!pointerActive) { target.x = W / 2; target.y = H / 2; }
  }
  function gameOver() {
    running = false;
    if (score > best) { best = score;
      try { localStorage.setItem("sharkBest", String(best)); } catch (_) {}
      bestEl.textContent = "🏆 " + best; }
    msgEl.innerHTML = "Jerung kena sengat ubur-ubur beracun! 🪼<br><br>" +
      "Markah: <b>" + score + " ikan</b><br>Terbaik: <b>" + best + "</b>";
    overlay.querySelector("h1").textContent = "GAME OVER";
    startBtn.textContent = "MAIN LAGI";
    overlay.classList.remove("hidden");
  }
  startBtn.addEventListener("click", start);
  startBtn.addEventListener("touchend", (e) => { e.preventDefault(); start(); }, { passive: false });
  canvas.addEventListener("pointerdown", () => { if (!running && ready) start(); });

  // ----- Drawing helpers -----
  function drawSprite(img, x, y, size, rot) {
    if (!img || !img.complete || !img.naturalWidth) return false;
    const ar = img.naturalWidth / img.naturalHeight;
    let w = size, h = size;
    if (ar >= 1) h = size / ar; else w = size * ar;
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
    return true;
  }

  function burst(x, y) {
    for (let i = 0; i < 12; i++)
      particles.push({ x, y, vx: rand(-2.4, 2.4), vy: rand(-2.4, 2.4), life: 1,
        c: `hsl(${rand(190,210)},90%,${rand(70,90)}%)` });
  }

  // ----- Loop -----
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(2.2, (now - last) / 16.67); last = now;
    update(dt); render(); requestAnimationFrame(loop);
  }

  function update(dt) {
    t += dt;
    for (const b of bubbles) { b.y -= b.v * dt; if (b.y < -5) { b.y = H + 5; b.x = rand(0, W); } }
    if (!running) return;

    // shark glides toward finger and turns to face travel direction
    const dx = target.x - shark.x, dy = target.y - shark.y;
    const dist = Math.hypot(dx, dy);
    shark.x += dx * 0.085 * dt; shark.y += dy * 0.085 * dt;
    if (dist > 6) shark.heading = angLerp(shark.heading, Math.atan2(dy, dx), 0.12 * dt);

    if (Math.random() < 0.02 * dt + score * 0.0002) spawnFish();
    if (Math.random() < (0.0045 + score * 0.0004) * dt) spawnJelly();

    const eatR = 52;
    for (let i = fishes.length - 1; i >= 0; i--) {
      const f = fishes[i];
      f.wob += 0.1 * dt;
      const a = Math.atan2(f.vy, f.vx) + f.turn * dt;
      const sp = Math.hypot(f.vx, f.vy);
      f.vx = Math.cos(a) * sp; f.vy = Math.sin(a) * sp;
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < -60 || f.x > W + 60 || f.y < -60 || f.y > H + 60) { fishes.splice(i, 1); continue; }
      if (Math.hypot(f.x - shark.x, f.y - shark.y) < eatR) {
        burst(f.x, f.y); fishes.splice(i, 1); score++;
        scoreEl.textContent = "🐟 " + score;
      }
    }

    const hitR = 44;
    for (let i = jellies.length - 1; i >= 0; i--) {
      const j = jellies[i];
      j.pulse += 0.07 * dt; j.y += j.vy * dt; j.x += j.vx * dt;
      if (j.y < -70) { jellies.splice(i, 1); continue; }
      if (Math.hypot(j.x - shark.x, j.y - shark.y) < hitR) { burst(shark.x, shark.y); gameOver(); return; }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.05 * dt; p.life -= 0.025 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function render() {
    // water background (cover)
    if (IMG.water.complete && IMG.water.naturalWidth) {
      const iw = IMG.water.naturalWidth, ih = IMG.water.naturalHeight;
      const s = Math.max(W / iw, H / ih);
      const w = iw * s, h = ih * s;
      ctx.drawImage(IMG.water, (W - w) / 2, (H - h) / 2, w, h);
    } else {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, "#0a4d72"); g.addColorStop(1, "#021b2e");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    // god rays
    ctx.globalAlpha = 0.045; ctx.fillStyle = "#cfeeff";
    for (let i = 0; i < 5; i++) {
      const x = ((i * 197 + t * 0.25) % (W + 240)) - 120;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 70, 0);
      ctx.lineTo(x + 180, H); ctx.lineTo(x + 110, H); ctx.closePath(); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // jellies (under shark)
    for (const j of jellies) {
      const pulse = 1 + 0.08 * Math.sin(j.pulse);
      drawSprite(IMG.jelly, j.x, j.y, 78 * j.size * pulse, Math.sin(j.pulse * 0.5) * 0.15);
    }

    // fish
    for (const f of fishes) {
      const rot = Math.atan2(f.vy, f.vx) + Math.PI / 2 + Math.sin(f.wob) * 0.08;
      drawSprite(IMG.fish, f.x, f.y, 52 * f.size, rot);
    }

    // bubbles
    ctx.fillStyle = "rgba(200,235,255,0.4)";
    for (const b of bubbles) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill(); }

    // shark
    if (running) {
      const bob = Math.sin(t * 0.25) * 0.04;
      // soft shadow
      ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = "#000";
      ctx.beginPath(); ctx.ellipse(shark.x, shark.y + 6, 60, 34, 0, 0, 6.28); ctx.fill(); ctx.restore();
      drawSprite(IMG.shark, shark.x, shark.y, 165, shark.heading + Math.PI / 2 + bob);
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // hint
    if (running && hintT > 0) {
      hintT--;
      ctx.globalAlpha = Math.min(1, hintT / 70);
      ctx.fillStyle = "#eaf6ff"; ctx.font = "bold 22px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("👆 Gerakkan jari kau!", W / 2, H * 0.16);
      ctx.globalAlpha = 1; ctx.textAlign = "start";
    }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
